<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6e56">
<meta name="mobile-web-app-capable" content="yes">
<title>병원 택시</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  [hidden] { display: none !important; }
  .guide { display: inline-flex; align-items: center; min-height: 48px; padding: 0 4px; font-size: 18px; font-weight: 700; color: #0f6e56; text-decoration: underline; text-underline-offset: 4px; align-self: flex-start; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { font-family: -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; background: #f6f5f1; color: #1a1a18; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; min-height: 100vh; padding: 20px 18px 28px; display: flex; flex-direction: column; }
  .screen { display: none; flex-direction: column; gap: 16px; flex: 1; }
  .screen.on { display: flex; }
  .hello { font-size: 28px; font-weight: 700; text-align: center; padding-top: 6px; user-select: none; -webkit-user-select: none; }

  .big { border: 0; border-radius: 22px; width: 100%; padding: 28px 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; text-decoration: none; }
  .big:active, .call:active, .family:active, .fam-btn:active { transform: scale(0.98); }
  .big .ico { font-size: 56px; line-height: 1; }
  .big .t { font-size: 38px; font-weight: 800; }
  .big .r { font-size: 22px; font-weight: 500; }
  .go { background: #0f6e56; color: #fff; }
  .home { background: #c2541f; color: #fff; }

  .family { margin-top: auto; border: 3px solid #1a1a18; background: #fff; color: #1a1a18; border-radius: 18px; padding: 18px; font-size: 28px; font-weight: 700; font-family: inherit; text-align: center; display: block; width: 100%; cursor: pointer; }
  .fam-btn { background: #fff; border: 3px solid #1a1a18; color: #1a1a18; border-radius: 18px; padding: 18px; font-size: 30px; font-weight: 800; text-decoration: none; text-align: center; display: block; }
  .call { background: #185fa5; color: #fff; border-radius: 22px; padding: 24px 16px; font-size: 34px; font-weight: 800; text-align: center; text-decoration: none; display: block; }
  .back { background: transparent; border: 2px solid #b4b2a9; color: #44443f; border-radius: 16px; padding: 14px; font-size: 22px; font-family: inherit; cursor: pointer; }
  .add { background: transparent; border: 2px dashed #888780; color: #44443f; border-radius: 16px; padding: 14px; font-size: 22px; font-family: inherit; cursor: pointer; }
  .main-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 36px; }
  .fix { align-self: center; background: transparent; border: 0; color: #55544f; font-size: 21px; text-decoration: underline; text-underline-offset: 4px; font-family: inherit; min-height: 56px; padding: 10px 20px; cursor: pointer; }
  .form .add-row { background: transparent; border: 2px dashed #888780; color: #44443f; border-radius: 16px; padding: 14px; font-size: 22px; font-family: inherit; cursor: pointer; }
  .empty { background: #fff4d6; color: #6b4a00; border: 2px dashed #d9a400; border-radius: 16px; padding: 18px; font-size: 22px; text-align: center; }

  .form h1 { font-size: 24px; }
  .form p.note { font-size: 18px; color: #55544f; line-height: 1.45; }
  .form .box { border: 1px solid #d3d1c7; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
  .form label { font-size: 18px; color: #44443f; display: flex; flex-direction: column; gap: 6px; }
  .form input { font-size: 20px; padding: 12px; border: 1px solid #b4b2a9; border-radius: 10px; font-family: inherit; background: #fff; color: #1a1a18; width: 100%; min-width: 0; }
  .form input::placeholder { color: #6b6a65; opacity: 1; }   /* 빨간 오류 배경 위에서도 4.5:1 이상 */
  .form .pair { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 8px; }
  .form .save { background: #0f6e56; color: #fff; border: 0; border-radius: 14px; padding: 18px; font-size: 22px; font-weight: 700; font-family: inherit; cursor: pointer; }
  /* 저장·취소를 한 줄에: 저장이 넓게 왼쪽, 취소가 오른쪽 (설정 화면 길이 줄이기) */
  .form .btns { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
  /* 설정 화면: '+ 다른 번호 추가' 옆 '편집' 버튼, 편집 중에는 줄마다 둥근 X 버튼 */
  .form .tools { display: flex; align-items: center; gap: 8px; }
  .form .tools .add-row { flex: 1 1 auto; min-width: 0; }
  .edit-btn { background: transparent; border: 0; font-family: inherit; cursor: pointer; align-self: center; padding: 0 8px; flex: 0 0 auto; }
  .form .del { display: none; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #a32d2d; background: #fff; color: #a32d2d; font-size: 22px; font-weight: 800; font-family: inherit; line-height: 1; cursor: pointer; align-self: center; }
  #s-setup.editing .del { display: block; }
  /* 편집 중: X 자리를 내려고 호칭 칸·여백만 좁힘 (360px에서도 번호 11자리가 다 보이게) */
  #s-setup.editing .pair { grid-template-columns: 5em minmax(0, 1fr) 48px; gap: 6px; }
  #s-setup.editing .pair input { padding-left: 6px; padding-right: 4px; }
  /* 저장·취소 줄은 화면 아래에 붙여 둔다 (목록이 길어도 스크롤 없이 보이게) */
  #s-setup .btns { position: sticky; bottom: 0; z-index: 5; margin: 0 -18px; padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px)); background: #f6f5f1; border-top: 1px solid #d3d1c7; }
  /* 칸으로 이동할 때 아래 저장 줄에 가려지지 않게 */
  #s-setup input, #s-setup .box button { scroll-margin-bottom: 110px; }
  .form .err { color: #a32d2d; font-size: 18px; font-weight: 700; }
  .form .err:empty { display: none; }        /* 오류가 없을 때는 빈 줄을 차지하지 않게 */
  .form input[aria-invalid="true"] { border: 2px solid #a32d2d; background: #fff6f6; }
  /* 키보드로 옮겨 다닐 때 지금 어디에 있는지 굵게 보이게 */
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 4px solid #1a1a18; outline-offset: 3px; }
  /* 작은 폰(세로 740px 이하): 글자 크기는 그대로, 아이콘·여백만 줄여 첫 화면이 한 화면에 들어오게 */
  @media (max-height: 760px) {
    .app { padding-top: 12px; padding-bottom: 16px; }
    .hello { padding-top: 0; }
    .big { padding: 14px 16px; gap: 4px; }
    .big .ico { font-size: 40px; }
    .main-bottom { gap: 20px; }
  }
  @media (max-height: 600px) {
    .screen { gap: 12px; }
    .big { padding: 10px 16px; }
    .big .ico { font-size: 32px; }
    .main-bottom { gap: 12px; }
  }
  /* 아주 낮은 화면(주소창·내비게이션 바가 큰 경우): 글자 크기는 그대로, 줄 간격·여백만 더 줄임 */
  @media (max-height: 560px) {
    .app { padding-top: 8px; padding-bottom: 8px; }
    .screen { gap: 8px; }
    .hello { line-height: 1.2; }
    .big { padding: 6px 16px; gap: 0; }
    .big .ico { font-size: 26px; }
    .big .t, .big .r { line-height: 1.2; }
    .main-bottom { gap: 4px; }
    .fix { min-height: 48px; padding: 6px 20px; }
    .family { padding: 10px 18px; line-height: 1.2; }
    #s-setup .btns { padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
  }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: calc(100% - 36px); max-width: 444px; background: #1a1a18; color: #fff; border-radius: 20px; padding: 24px 16px; font-size: 28px; font-weight: 800; line-height: 1.35; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.3); z-index: 10; pointer-events: none; }
</style>
</head>
<body>
<div class="app">

  <!-- 1. 첫 화면: 누르면 바로 해당 센터로 전화 -->
  <section class="screen" id="s-main">
    <div class="hello" id="hello">어디로 모실까요?</div>
    <a class="big go" id="btn-go" href="tel:18991110" onclick="dialed(this)">
      <span class="ico" aria-hidden="true">🏥</span><span class="t">병원 갈 때</span><span class="r">집에서 병원으로 가요</span>
    </a>
    <a class="big home" id="btn-home" href="tel:16682222" onclick="dialed(this)">
      <span class="ico" aria-hidden="true">🏠</span><span class="t">집에 올 때</span><span class="r">병원에서 집으로 와요</span>
    </a>
    <div class="main-bottom">
      <button class="fix" onclick="openSetup()">가족 번호 고치기</button>
      <button class="family" style="margin-top:0" onclick="openFamily()"><span aria-hidden="true">📞</span> 가족에게 전화</button>
    </div>
  </section>


  <!-- 3. 가족 고르기 -->
  <section class="screen" id="s-family">
    <div class="hello">누구에게 걸까요?</div>
    <div id="family-list" style="display:flex;flex-direction:column;gap:12px"></div>
    <button class="add" onclick="openAdd()">+ 다른 번호 추가</button>
    <!-- '처음으로' 버튼 삭제: 전화를 걸면 자동으로 첫 화면으로 돌아감. 그냥 나갈 때는 폰의 뒤로가기 -->
  </section>

  <!-- 4. 다른 번호 추가 -->
  <section class="screen form" id="s-add">
    <h1>번호 추가</h1>
    <div class="box">
      <label>누구예요? (예: 외삼촌, 이웃집)
        <input type="text" id="a-label" autocomplete="off" aria-describedby="a-err">
      </label>
      <label>전화번호
        <input type="tel" id="a-phone" inputmode="tel" placeholder="010-0000-0000" aria-describedby="a-err">
      </label>
      <div class="err" id="a-err" role="alert"></div>
    </div>
    <div class="btns">
      <button class="save" onclick="saveAdd()">추가하기</button>
      <button class="back" onclick="openFamily()">취소</button>
    </div>
  </section>

  <!-- 5. 처음 설정: 가족 번호만 -->
  <section class="screen form" id="s-setup">
    <h1>가족 번호 설정</h1>
    <p class="note">번호는 이 휴대폰 안에만 저장됩니다. 비워둔 사람은 화면에 나오지 않아요.</p>
    <a class="guide" href="https://rkun231.github.io/taxi-portfolio/assets/guide-family.webp" target="_blank" rel="noopener">사용 설명서 보기 ↗</a>
    <div class="box">
      <div id="f-family" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="tools">
        <button class="add-row" onclick="addRow()">+ 다른 번호 추가</button>
        <button class="guide edit-btn" id="f-edit" type="button" onclick="setEdit(!$('s-setup').classList.contains('editing'))">편집</button>
      </div>
    </div>
    <div class="err" id="f-err" role="alert"></div>
    <div class="btns">
      <button class="save" onclick="saveSetup()">저장하기</button>
      <button class="back" id="f-cancel" onclick="show('s-main')">취소</button>
    </div>
  </section>

</div>

<div class="toast" id="exit-toast" role="status" aria-live="polite" hidden>한 번 더 누르면<br>앱이 닫혀요</div>
<div class="toast" id="save-toast" role="status" aria-live="polite" hidden>저장했어요</div>

<script>
/* 센터 번호 (공개 번호) */
const CENTER_GO   = "1899-1110";  // 병원 갈 때: 전남 센터
const CENTER_HOME = "1668-2222";  // 집에 올 때: 광주 센터

const FAMILY_DEFAULT = ["아들", "며느리", "큰딸", "둘째딸", "셋째딸", "막내딸"].map(label => ({ label, phone: "" }));
const KEY = "taxi-helper-family-v2";
const $ = id => document.getElementById(id);
const digits = n => String(n || "").replace(/[^0-9]/g, "");
const tel = n => "tel:" + digits(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* 화면에만 '-'를 넣어 보여줌 (저장은 숫자만) */
function fmt(n) {
  const d = digits(n);
  if (d.startsWith("02")) {
    if (d.length <= 2) return d;
    if (d.length <= 5) return d.slice(0, 2) + "-" + d.slice(2);
    if (d.length <= 9) return d.slice(0, 2) + "-" + d.slice(2, 5) + "-" + d.slice(5);
    return d.slice(0, 2) + "-" + d.slice(2, 6) + "-" + d.slice(6, 10);
  }
  if (d.length === 8 && /^1[5-9]/.test(d)) return d.slice(0, 4) + "-" + d.slice(4);
  if (/^1/.test(d) && d.length <= 4) return d;   // 112, 119, 1339 같은 번호는 '-' 없이
  if (d.length <= 3) return d;
  if (d.length <= 7) return d.slice(0, 3) + "-" + d.slice(3);
  if (d.length <= 10) return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6);
  return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 11);
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.matches && el.matches('input[type="tel"]')) el.value = fmt(el.value);
  if (el.removeAttribute) el.removeAttribute("aria-invalid");   // 고치기 시작하면 빨간 테두리 해제
});
/* 틀린 칸: 빨간 테두리 + 그 칸으로 이동 */
function markBad(el) { el.setAttribute("aria-invalid", "true"); el.focus(); }
function clearBad(root) { root.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute("aria-invalid")); }

let family = null;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const v = JSON.parse(raw);
    /* 저장값이 목록 모양이 아니면(손상) 없는 것으로 본다. 항목도 {label, phone} 모양만 남긴다 */
    if (Array.isArray(v)) {
      /* 호칭은 글자일 때만 쓴다(객체 등은 '가족'). 번호도 글자·숫자일 때만 */
      const list = v.filter(f => f && typeof f === "object" && !Array.isArray(f))
                    .map(f => ({ label: (typeof f.label === "string" && f.label.trim()) ? f.label.trim() : "가족",
                                 phone: (typeof f.phone === "string" || typeof f.phone === "number") ? digits(f.phone) : "" }));
      /* 정상 저장값은 기본 6줄 이상. 짧으면(옛 저장값 등) 기본 6줄을 원래 순서대로 세우고, 저장돼 있던 같은 호칭은 그 자리에 넣고,
         기본에 없는 호칭(예: 외삼촌)은 그 아래에 붙인다. (예전엔 6줄에서 멈춰 '막내딸'이 빠졌음) */
      if (list.length && list.length < FAMILY_DEFAULT.length) {
        const rest = list.slice();
        const base = FAMILY_DEFAULT.map(d => {
          const k = rest.findIndex(f => f.label === d.label);
          return k >= 0 ? rest.splice(k, 1)[0] : { ...d };
        });
        list.splice(0, list.length, ...base, ...rest);
      }
      family = list.length ? list : null;   // 비었으면 없는 것으로(설정 화면은 기본 6줄)
    }
  }
} catch (e) {}

const SAVE_FAIL = "저장하지 못했어요. 인터넷 앱의 비밀 모드를 꺼 주세요.";
/* 번호 확인: 010 휴대폰은 11자리여야 함. 센터(1899-1110 같은 8자리)나 집 전화(02-, 062-)는 그대로 허용.
   112·119 같은 긴급 번호, 1339 같은 1로 시작하는 3~4자리 번호도 허용. 그 밖에 7자리 미만은 막음 */
function usable(n) {
  const d = digits(n);
  return d.length >= 7 || (/^1/.test(d) && d.length >= 3 && d.length <= 4);
}
function badNumber(n) {
  const d = digits(n);
  if (!d) return "";
  if (d.startsWith("010") && d.length !== 11) return "자리 수가 맞지 않아요";
  if (!usable(d)) return "너무 짧아요";
  return "";
}
let saveTimer = null;
function showSaved() {
  const t = $("save-toast");
  t.hidden = false;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { t.hidden = true; }, 2000);
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(family)); return true; } catch (e) { return false; }
}
/* 화면 전환과 폰의 '뒤로가기'
   기록은 항상 [시작] → [첫 화면] → (다른 화면 1칸)까지만 쌓이게 한다.
   - 다른 화면에서 뒤로가기: 첫 화면으로
   - 첫 화면에서 뒤로가기 1번: "한 번 더 누르면 닫혀요" 안내
   - 3초 안에 1번 더: 앱 닫힘 */
const st = () => history.state || {};
function render(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  if (id !== "s-setup") setEdit(false);          // 설정 화면을 떠나면 편집 끝
  window.scrollTo(0, 0);
}
function show(id) {
  if (id === "s-main") return home();
  try {
    if (st().sub) history.replaceState({ sub: id }, "");
    else history.pushState({ sub: id }, "");
  } catch (e) {}
  render(id);
}
function home() {
  if (st().sub) { try { history.back(); return; } catch (e) {} }
  render("s-main");
}

let toastTimer = null;
function showExitToast() {
  $("exit-toast").hidden = false;
  if (navigator.vibrate) navigator.vibrate(40);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("exit-toast").hidden = true; }, 3000);
}
/* 안드로이드(크롬·삼성 인터넷)는 화면을 누르지 않은 채 추가된 뒤로가기 기록을 건너뛴다.
   그래서 '첫 화면' 칸은 할머니가 화면을 누르는 순간에 만든다. */
/* 아이폰·아이패드: 홈 화면 앱은 '뒤로'(왼쪽 끝 밀기)로 닫을 수 없고, 밀기 동작이 pointerup 으로도 들어와
   '첫 화면' 칸을 다시 만든다. 그래서 아이폰에서는 '첫 화면' 칸과 닫힘 안내를 쓰지 않는다. */
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function armGuard() {
  if (IOS) return;
  try { if (!st().main && !st().sub) history.pushState({ main: true }, ""); } catch (e) {}
}
["pointerup", "touchend", "click", "keydown"].forEach(t =>
  document.addEventListener(t, armGuard, { capture: true, passive: true }));
window.addEventListener("popstate", () => {
  const s = st();
  if (s.sub) { render(s.sub); return; }
  render("s-main");
  if (s.main || IOS) { $("exit-toast").hidden = true; return; }
  showExitToast();          /* 시작 칸까지 왔음: 여기서 한 번 더 누르면 닫힘 */
});
try { if (st().sub) history.replaceState({ main: true }, ""); } catch (e) {}

/* 버튼 사용 횟수 기록: 어떤 버튼인지와 폰마다 만든 임의 번호만 보낸다 (전화번호는 보내지 않음).
   주소 끝에 ?test 가 붙어 있으면 보내지 않는다. 화면에는 아무것도 보이지 않는다. */
const LOG_URL = "https://script.google.com/macros/s/AKfycbzgXoYzc1xjgZIYr5_EXj9M71vmLdVzSpPoQ-ydiXTNqqc81gk729DoHn242f1P4Z9i3Q/exec";
const LOG_OFF = new URLSearchParams(location.search).has("test");
function deviceId() {
  try {
    let d = localStorage.getItem("taxi-helper-device");
    if (!d) {
      d = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
      localStorage.setItem("taxi-helper-device", d);
    }
    return d;
  } catch (e) { return ""; }
}
function logTap(b) {
  if (!LOG_URL || LOG_OFF) return;
  try {
    const body = JSON.stringify({ b, d: deviceId() });
    if (navigator.sendBeacon && navigator.sendBeacon(LOG_URL, new Blob([body], { type: "text/plain" }))) return;
    fetch(LOG_URL, { method: "POST", mode: "no-cors", body, keepalive: true }).catch(() => {});
  } catch (e) {}
}

/* 가족에게 전화를 걸면 전화 앱으로 넘어가고, 돌아오면 첫 화면 */
function familyDialed() {
  logTap("family");
  if (navigator.vibrate) navigator.vibrate(40);
  setTimeout(home, 400);
}

$("btn-go").href = tel(CENTER_GO);
$("btn-home").href = tel(CENTER_HOME);
function dialed(a) {
  logTap(a.id === "btn-go" ? "go" : "home");
  if (navigator.vibrate) navigator.vibrate(40);
  /* 전화 앱으로 바로 넘어가고, 돌아오면 첫 화면 그대로 */
}

function openFamily() {
  const list = (family || []).filter(f => usable(f.phone));
  $("family-list").innerHTML = list.length
    ? list.map(f => `<a class="fam-btn" href="${tel(f.phone)}" onclick="familyDialed()"><span aria-hidden="true">📞</span> ${esc(f.label)}</a>`).join("")
    : `<div class="empty">아직 등록된 번호가 없어요.<br>가족에게 번호를 넣어 달라고 하세요.</div>`;
  show("s-family");
}

function openAdd() { $("a-label").value = ""; $("a-phone").value = ""; $("a-err").textContent = ""; clearBad($("s-add")); show("s-add"); }
function saveAdd() {
  const label = $("a-label").value.trim(), phone = $("a-phone").value.trim();
  $("a-err").textContent = "";
  clearBad($("s-add"));
  if (!label || !digits(phone)) {
    $("a-err").textContent = "이름과 전화번호를 모두 넣어 주세요.";
    if (!digits(phone)) $("a-phone").setAttribute("aria-invalid", "true");
    markBad(label ? $("a-phone") : $("a-label"));
    return;
  }
  const bad = badNumber(phone);
  if (bad) { $("a-err").textContent = `번호가 ${bad}. 다시 확인해 주세요.`; markBad($("a-phone")); return; }
  family = family || FAMILY_DEFAULT.map(f => ({ ...f }));
  const slot = family.find(f => f.label === label && !digits(f.phone));
  if (slot) slot.phone = digits(phone);          // 빈 '아들' 칸이 있으면 그 칸에 채움
  else family.push({ label, phone: digits(phone) });
  if (!persist()) { $("a-err").textContent = SAVE_FAIL; return; }
  openFamily();
}

function rowHtml(f, i) {
  const n = i + 1;   // 스크린리더가 몇 번째 줄인지 알 수 있게
  return `<div class="pair">
      <input type="text" class="fl" value="${esc(f.label)}" placeholder="누구" aria-label="${n}번째 줄 호칭">
      <input type="tel" class="fp" value="${esc(fmt(f.phone))}" inputmode="tel" placeholder="010-0000-0000" aria-label="${n}번째 줄 번호">
      <button class="del" type="button" onclick="delRow(this)" aria-label="${esc(delName(f.label, n))}">✕</button>
    </div>`;
}
/* 편집(X) 버튼: 기본 6줄은 호칭·번호만 비우고 줄은 남김, '+ 다른 번호 추가'로 늘린 줄은 줄째 지움.
   저장하기를 눌러야 실제로 바뀜 (취소하면 그대로) */
function delName(label, n) { return `이 줄 지우기 (${String(label || "").trim() || n + "번째 줄"})`; }
function setEdit(on) {
  $("s-setup").classList.toggle("editing", on);
  $("f-edit").textContent = on ? "완료" : "편집";
}
function renumber() {
  $("f-family").querySelectorAll(".pair").forEach((row, i) => {
    row.querySelector(".fl").setAttribute("aria-label", `${i + 1}번째 줄 호칭`);
    row.querySelector(".fp").setAttribute("aria-label", `${i + 1}번째 줄 번호`);
    row.querySelector(".del").setAttribute("aria-label", delName(row.querySelector(".fl").value, i + 1));
  });
}
function delRow(btn) {
  const row = btn.closest(".pair");
  const rows = [...$("f-family").querySelectorAll(".pair")];
  const i = rows.indexOf(row);
  if ($("f-err").previousElementSibling === row) setupErr("");   // 이 줄 밑 오류 문구도 치움
  if (i < FAMILY_DEFAULT.length) {
    row.querySelectorAll("input").forEach(el => { el.value = ""; el.removeAttribute("aria-invalid"); el.removeAttribute("aria-describedby"); });
    renumber();
    btn.focus();
  } else {
    row.remove();
    renumber();
    $("f-family").querySelectorAll(".del")[i - 1].focus();   // 바로 위 줄의 X로
  }
}
$("f-family").addEventListener("input", e => { if (e.target.classList.contains("fl")) renumber(); });
/* 설정 화면 오류 칸: 틀린 줄 바로 아래로 옮겨 보여 주고, 저장 실패 같은 공통 오류는 원래 자리(목록 아래) */
function setupErr(msg, row) {
  const e = $("f-err");
  if (row) row.after(e); else $("s-setup").querySelector(".box").after(e);
  e.textContent = msg;
}
function openSetup() {
  setupErr("");                                  // 오류 칸을 목록 밖 원래 자리로 (목록을 다시 그리기 전에)
  const v = family || FAMILY_DEFAULT;
  $("f-family").innerHTML = v.map(rowHtml).join("");
  setEdit(false);
  $("f-cancel").hidden = false;
  show("s-setup");
}
function addRow() {
  $("f-family").insertAdjacentHTML("beforeend", rowHtml({ label: "", phone: "" }, $("f-family").querySelectorAll(".pair").length));
  const rows = $("f-family").querySelectorAll(".fl");
  rows[rows.length - 1].focus();
}
function saveSetup() {
  const labels = [...$("f-family").querySelectorAll(".fl")];
  const phones = [...$("f-family").querySelectorAll(".fp")];
  setEdit(false);
  setupErr("");
  clearBad($("f-family"));
  $("f-family").querySelectorAll('[aria-describedby]').forEach(el => el.removeAttribute("aria-describedby"));
  for (let i = 0; i < phones.length; i++) {
    const bad = badNumber(phones[i].value);
    if (bad) {
      setupErr(`'${labels[i].value.trim() || "가족"}' 번호가 ${bad}. 다시 확인해 주세요.`, phones[i].closest(".pair"));
      phones[i].setAttribute("aria-describedby", "f-err");   // 틀린 칸에 오류 문구를 연결
      markBad(phones[i]);
      return;
    }
  }
  /* 번호가 있는 줄끼리 호칭이 같으면 막음 (가족 화면에 같은 이름 버튼이 두 개 생기지 않게) */
  const seen = new Set();
  for (let i = 0; i < labels.length; i++) {
    if (!digits(phones[i].value)) continue;
    const name = labels[i].value.trim() || "가족";
    if (seen.has(name)) {
      setupErr("같은 이름이 두 번 있어요. 하나를 '큰아들'처럼 바꿔 주세요", labels[i].closest(".pair"));
      labels[i].setAttribute("aria-describedby", "f-err");
      markBad(labels[i]);
      return;
    }
    seen.add(name);
  }
  family = labels.map((l, i) => ({ label: l.value.trim() || "가족", phone: digits(phones[i].value) }))
            .filter((f, i) => i < FAMILY_DEFAULT.length || usable(f.phone));
  if (!persist()) { setupErr(SAVE_FAIL); return; }
  show("s-main");
  showSaved();
}

show("s-main");
</script>
